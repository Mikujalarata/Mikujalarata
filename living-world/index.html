<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Alexander — The Living World</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#02030a;color:#eef2ff;font-family:Inter,ui-sans-serif,system-ui,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:24px;box-sizing:border-box}.brand{letter-spacing:.22em;font-size:11px;text-transform:uppercase;opacity:.7}.title{font-size:28px;font-weight:600;margin-top:6px}.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 16px;border:1px solid #ffffff24;border-radius:999px;background:#050712bb;backdrop-filter:blur(12px);font-size:12px;white-space:nowrap}.zone{position:absolute;right:24px;top:24px;text-align:right;font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}.fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .7s}.mobile{display:none;position:fixed;left:20px;bottom:28px;width:116px;height:116px;border:1px solid #ffffff28;border-radius:50%;background:#ffffff08;touch-action:none}.knob{position:absolute;width:46px;height:46px;left:35px;top:35px;border-radius:50%;background:#ffffff22;border:1px solid #ffffff30}.tap{position:fixed;right:22px;bottom:34px;width:64px;height:64px;border-radius:50%;border:1px solid #ffffff28;background:#ffffff0d;color:white;display:none;align-items:center;justify-content:center;font-size:11px}.progress{position:absolute;left:24px;bottom:24px;width:150px;height:2px;background:#ffffff16}.progress i{display:block;height:100%;width:12%;background:#fff;opacity:.8}@media(max-width:800px){.mobile,.tap{display:flex}.hint{bottom:165px;font-size:11px}.title{font-size:22px}.zone{top:76px}.progress{bottom:150px}}
</style>
</head>
<body>
<div id="hud"><div class="brand">Living World / 001</div><div class="title">The Living World</div><div class="zone" id="zone">Central Hub</div><div class="hint" id="hint">Click to explore · WASD / arrows · E to interact</div><div class="progress"><i id="bar"></i></div></div>
<div class="mobile" id="stick"><div class="knob" id="knob"></div></div><button class="tap" id="action">ENTER</button><div class="fade" id="fade"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02030a); scene.fog=new THREE.FogExp2(0x050814,.018);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,600); camera.position.set(0,4.5,13);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement); controls.enableDamping=true; controls.enablePan=false; controls.minDistance=6; controls.maxDistance=22; controls.maxPolarAngle=Math.PI*.48; controls.target.set(0,2,0);
const hemi=new THREE.HemisphereLight(0x8da4ff,0x050509,1.4); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xdbe7ff,2.5); sun.position.set(12,20,8); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);
const glow=new THREE.PointLight(0x5d6bff,16,35); glow.position.set(0,5,0); scene.add(glow);
const world=new THREE.Group(); scene.add(world);
const mat=(c,m=0.1,e=0)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:.5,emissive:e?c:0,emissiveIntensity:e});
const floorMat=mat(0x0a0c14,.55); const dark=mat(0x111522,.65); const glass= new THREE.MeshPhysicalMaterial({color:0x8295ff,transparent:true,opacity:.14,roughness:.1,metalness:.35});
function box(x,y,z,sx,sy,sz,ma=dark){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),ma);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;world.add(o);return o}
box(0,-.35,0,60,.5,60,floorMat);
for(let i=0;i<22;i++){const a=i/22*Math.PI*2,r=14+(i%3)*3;const h=3+(i*7%9);const b=box(Math.cos(a)*r,h/2,Math.sin(a)*r,2.4,h,2.4,mat(0x11182b,.7));b.rotation.y=a;for(let y=1;y<h;y+=1.3){const w=box(b.position.x,y,b.position.z,2.5,.08,.08,mat(0x4b64ff,.4,1));w.rotation.y=a+Math.PI/2}}
// Central memory monolith
const monolith=box(0,4,0,5,8,2,glass);monolith.name='memory';
const ring=new THREE.Mesh(new THREE.TorusGeometry(3.8,.045,12,96),new THREE.MeshBasicMaterial({color:0x8fa5ff,transparent:true,opacity:.8}));ring.rotation.x=Math.PI/2;ring.position.y=.15;world.add(ring);
// Three gateways
const gateways=[];[['MEMORIES',-8,0x91a7ff],['PROJECTS',8,0x9affd0],['DIGITAL CITY',0,-10,0xc58cff]].forEach(([name,x,c],idx)=>{let z=idx===2?-10:1.5;const g=new THREE.Group();g.position.set(x,2.5,z);const frame=new THREE.Mesh(new THREE.TorusGeometry(2.2,.18,16,64),new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:2,metalness:.5,roughness:.2}));frame.scale.set(1,1.35,1);g.add(frame);const label=document.createElement('canvas');label.width=512;label.height=96;const ctx=label.getContext('2d');ctx.fillStyle='white';ctx.font='bold 42px sans-serif';ctx.textAlign='center';ctx.fillText(name,256,58);const tex=new THREE.CanvasTexture(label);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(5,.94,1);sp.position.y=3.1;g.add(sp);g.userData={name,destination:name.toLowerCase().replace(' ','-')};world.add(g);gateways.push(g)});
// Floating data particles
const pts=[];for(let i=0;i<650;i++){const p=new THREE.Vector3((Math.random()-.5)*42,Math.random()*18+.3,(Math.random()-.5)*42);if(Math.abs(p.x)<5&&Math.abs(p.z)<5)p.multiplyScalar(2);pts.push(p.x,p.y,p.z)}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));const pm=new THREE.PointsMaterial({color:0x7890ff,size:.035,transparent:true,opacity:.65});const particles=new THREE.Points(pg,pm);world.add(particles);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let mobileX=0,mobileY=0;const stick=document.querySelector('#stick'),knob=document.querySelector('#knob');stick.addEventListener('pointermove',e=>{if(e.pressure===0)return;const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;mobileX=THREE.MathUtils.clamp((e.clientX-cx)/40,-1,1);mobileY=THREE.MathUtils.clamp((e.clientY-cy)/40,-1,1);knob.style.transform=`translate(${mobileX*28}px,${mobileY*28}px)`});stick.addEventListener('pointerup',()=>{mobileX=mobileY=0;knob.style.transform=''});document.querySelector('#action').onclick=interact;
function interact(){let best=null,bd=4;for(const g of gateways){const d=camera.position.distanceTo(g.position);if(d<bd){bd=d;best=g}}if(best){document.querySelector('#zone').textContent=best.userData.name;document.querySelector('#hint').textContent=`Entering ${best.userData.name}…`;document.querySelector('#fade').style.opacity=1;setTimeout(()=>{document.querySelector('#fade').style.opacity=0;document.querySelector('#hint').textContent='Explore the new district · E to interact'},800);}}
function move(dt){const v=new THREE.Vector3((keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+mobileX,0,(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+mobileY);if(v.lengthSq()){v.normalize();const speed=dt*7;camera.position.addScaledVector(v,speed);controls.target.addScaledVector(v,speed);camera.position.y=THREE.MathUtils.lerp(camera.position.y,4.5,.08);}}
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;move(dt);controls.update();particles.rotation.y+=dt*.018;ring.rotation.z+=dt*.15;gatewayPulse(now);renderer.render(scene,camera)}
function gatewayPulse(t){gateways.forEach((g,i)=>{g.scale.setScalar(1+Math.sin(t*.002+i)*.025);g.children[0].rotation.z=t*.0004*(i%2?1:-1)})}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<800?1.35:2))});animate(last);
</script></body></html>
