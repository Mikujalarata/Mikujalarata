<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111820">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kidbrooke Flat VR · iPhone</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0e12;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;color:white;touch-action:none}body{height:100dvh}#scene{position:fixed;inset:0;width:100%;height:100%;display:block;background:#111}#start{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:calc(20px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left));background:linear-gradient(#101720,#07090d)}#start.hide{display:none}.card{max-width:430px;background:rgba(18,23,30,.94);border:1px solid rgba(255,255,255,.15);border-radius:22px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.4)}h1{font-size:28px;margin:0 0 8px}p{line-height:1.4;color:#d7dde4}button{font:inherit;border:0;border-radius:14px;padding:12px 15px;font-weight:700}#enter{width:100%;background:white;color:#101317;font-size:17px}.top{position:fixed;z-index:5;top:calc(8px + env(safe-area-inset-top));left:calc(10px + env(safe-area-inset-left));right:calc(10px + env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:center;pointer-events:none}.chip{background:rgba(13,18,24,.72);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 11px;font-size:12px}.toolbar{position:fixed;z-index:6;top:calc(52px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:6px}.toolbar button{padding:8px 10px;background:rgba(15,20,27,.78);color:white;border:1px solid rgba(255,255,255,.15);font-size:12px}.stick{position:fixed;z-index:8;bottom:calc(18px + env(safe-area-inset-bottom));width:118px;height:118px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);touch-action:none}.stick:after{content:"";position:absolute;inset:37px;border-radius:50%;background:rgba(255,255,255,.27);transform:translate(var(--dx,0px),var(--dy,0px))}.stick span{position:absolute;bottom:-17px;width:100%;text-align:center;font-size:10px;color:#cdd4db}#left-stick{left:calc(16px + env(safe-area-inset-left))}#right-stick{right:calc(16px + env(safe-area-inset-right))}.notice{position:fixed;z-index:4;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:10px;color:#e8edf1;background:rgba(0,0,0,.45);padding:5px 8px;border-radius:9px;pointer-events:none}.portrait{display:none}@media (orientation:portrait){.stick{width:102px;height:102px}.stick:after{inset:32px}.toolbar{top:auto;bottom:calc(136px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%)}.portrait{display:block}}
</style>
</head>
<body>
<div id="start"><div class="card"><h1>Kidbrooke Flat VR</h1><p>iPhone-safe first-person reconstruction. This build has no external 3D dependency, so it renders directly in Safari.</p><p class="portrait">Landscape gives the widest view.</p><button id="enter">Tap to enter flat</button></div></div>
<canvas id="scene" aria-label="First-person Kidbrooke flat reconstruction"></canvas>
<div class="top"><div id="room" class="chip">Entrance</div><div class="chip">≈ 65 m² representative 1-bed</div></div>
<div class="toolbar"><button id="day">Day</button><button id="furn">Furnished</button><button id="measure">Measure</button></div>
<div id="left-stick" class="stick"><span>WALK</span></div><div id="right-stick" class="stick"><span>LOOK</span></div>
<div class="notice">Reconstruction, not an exact survey of a specific flat.</div>
<script>
(()=>{
const c=document.getElementById('scene'),ctx=c.getContext('2d',{alpha:false});
const MAP=['####################','#......#...........#','#......#...........#','#......#...........#','#......#...........#','#......#...........#','#......#...........#','#......D...........#','#####D######DD######','#....#.............#','#....#.............#','#....#.............#','#....#.............#','#########D##########'];
const CELL=.5,MW=MAP[0].length,MH=MAP.length;let day=true,furnished=true,measure=false;
let p={x:.15,z:2.8,yaw:Math.PI,pitch:0};let last=performance.now();
const input={mx:0,my:0,lx:0,ly:0};
function solid(mx,my){return mx<0||my<0||mx>=MW||my>=MH||MAP[my][mx]==='#'}
function worldMap(x,z){return{x:Math.floor((x+MW*CELL/2)/CELL),y:Math.floor((z+MH*CELL/2)/CELL)}}
function blocked(x,z){const q=worldMap(x,z);return solid(q.x,q.y)}
function resize(){const dpr=Math.min(devicePixelRatio||1,1.35);const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
function move(dt){p.yaw-=input.lx*1.7*dt;p.pitch=Math.max(-.62,Math.min(.62,p.pitch-input.ly*1.1*dt));const f=input.my*2.4*dt,s=input.mx*2.1*dt;const nx=p.x+Math.sin(p.yaw)*f+Math.cos(p.yaw)*s,nz=p.z-Math.cos(p.yaw)*f+Math.sin(p.yaw)*s;if(!blocked(nx,p.z))p.x=nx;if(!blocked(p.x,nz))p.z=nz}
function draw(){const w=innerWidth,h=innerHeight,hor=h*(.48+p.pitch*.16);let g=ctx.createLinearGradient(0,0,0,hor);g.addColorStop(0,day?'#b9d5ea':'#07101f');g.addColorStop(1,day?'#eef2f2':'#172237');ctx.fillStyle=g;ctx.fillRect(0,0,w,hor);g=ctx.createLinearGradient(0,hor,0,h);g.addColorStop(0,day?'#cdb899':'#504a44');g.addColorStop(1,day?'#67523e':'#16191c');ctx.fillStyle=g;ctx.fillRect(0,hor,w,h-hor);const cols=Math.min(300,Math.max(120,Math.floor(w/2))),cw=w/cols+1,fov=Math.PI*.38;for(let i=0;i<cols;i++){const cx=(i/(cols-1)-.5)*2,a=p.yaw+cx*fov/2,rx=Math.sin(a),rz=-Math.cos(a);let d=.03,mp={x:0,y:0};for(;d<15;d+=.035){mp=worldMap(p.x+rx*d,p.z+rz*d);if(solid(mp.x,mp.y))break}const cd=Math.max(.1,d*Math.cos(a-p.yaw)),wh=Math.min(h*1.8,h*1.45/cd),top=hor-wh/2,shade=Math.max(52,224-cd*17),warm=(mp.x+mp.y)%2===0;ctx.fillStyle=day?`rgb(${shade|0},${(shade*(warm?.97:1))|0},${(shade*.92)|0})`:`rgb(${(shade*.38)|0},${(shade*.4)|0},${(shade*.46)|0})`;ctx.fillRect(i*cw,top,cw+1,wh);if(measure&&i%18===0){ctx.fillStyle='rgba(255,255,255,.13)';ctx.fillRect(i*cw,top,1,wh)}}if(furnished){ctx.fillStyle='rgba(25,29,33,.58)';ctx.fillRect(w*.59,hor+h*.13,w*.17,h*.115);ctx.fillStyle='rgba(193,177,153,.65)';ctx.fillRect(w*.35,hor+h*.16,w*.13,h*.067)}const room=p.z>1.3?'Entrance / circulation':p.x<-1.5?'Bedroom':p.x>1.2?'Living / kitchen':'Bathroom / storage';document.getElementById('room').textContent=room}
function frame(t){const dt=Math.min((t-last)/1000,.04);last=t;move(dt);draw();requestAnimationFrame(frame)}
function stick(el,onmove){let id=null,cx=0,cy=0;const end=e=>{if(id===null)return;if(e.pointerId!==id)return;id=null;el.style.setProperty('--dx','0px');el.style.setProperty('--dy','0px');onmove(0,0)};el.addEventListener('pointerdown',e=>{id=e.pointerId;el.setPointerCapture?.(id);const r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;e.preventDefault()});el.addEventListener('pointermove',e=>{if(e.pointerId!==id)return;const r=el.getBoundingClientRect(),max=r.width*.28,dx=Math.max(-max,Math.min(max,e.clientX-cx)),dy=Math.max(-max,Math.min(max,e.clientY-cy));el.style.setProperty('--dx',dx+'px');el.style.setProperty('--dy',dy+'px');onmove(dx/max,-dy/max);e.preventDefault()});el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
stick(document.getElementById('left-stick'),(x,y)=>{input.mx=x;input.my=y});stick(document.getElementById('right-stick'),(x,y)=>{input.lx=x;input.ly=y});
document.getElementById('day').onclick=e=>{day=!day;e.currentTarget.textContent=day?'Day':'Night'};document.getElementById('furn').onclick=e=>{furnished=!furnished;e.currentTarget.textContent=furnished?'Furnished':'Empty'};document.getElementById('measure').onclick=e=>{measure=!measure;e.currentTarget.textContent=measure?'Measured':'Measure'};
document.getElementById('enter').onclick=()=>document.getElementById('start').classList.add('hide');
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});addEventListener('resize',resize,{passive:true});visualViewport?.addEventListener('resize',resize,{passive:true});addEventListener('orientationchange',()=>setTimeout(resize,120),{passive:true});resize();requestAnimationFrame(frame);
})();
</script>
</body></html>
